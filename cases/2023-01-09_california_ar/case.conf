# Case configuration — sourced by the run scripts.
# 9–11 January 2023 atmospheric river over California: heavy orographic
# precipitation on the Sierra Nevada and Coast Ranges, rain at low elevations,
# snow at high elevations. Good demo of terrain-controlled T2 and precipitation.
# 12 km parent (eastern Pacific + western US), 4 km nest over central CA / Sierra.
CASE_NAME="2023-01-09_california_ar"
START="2023-01-09_00"        # YYYY-MM-DD_HH (UTC)
END="2023-01-11_00"          # 48 h
MET_SOURCE="fnl/${CASE_NAME}" # subdir of $MET_DIR holding this case's GRIB2 files
VTABLE="Vtable.GFS"
INTERVAL_SECONDS=21600

# 4 km nest is ~3x the cost of the Moore case (bigger + 48 h): 4 nodes x 20 tasks.
WRF_NODES=4
WRF_TASKS_PER_NODE=20
WRF_WALLTIME="08:00:00"
