# Case configuration — sourced by the run scripts.
# 20 May 2013 central Oklahoma supercell outbreak (Moore EF5 tornado,
# ~1956-2035 UTC). Two-way nested run: 15 km parent, 3 km convection-
# permitting nest over Oklahoma, initialized from NCEP FNL 1-degree.
CASE_NAME="2013-05-20_moore"
START="2013-05-20_12"        # YYYY-MM-DD_HH (UTC)
END="2013-05-21_00"
MET_SOURCE="fnl"             # subdir of $MET_DIR holding the GRIB2 files
VTABLE="Vtable.GFS"          # FNL uses the GFS Vtable
INTERVAL_SECONDS=21600       # 6-hourly boundary conditions

# Resources for wrf.exe (sooner_test_32gb_20core nodes have 20 cores each)
WRF_NODES=2
WRF_TASKS_PER_NODE=20
WRF_WALLTIME="04:00:00"
